<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Branch &amp; Bug</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: a field-study board. The weighted graph is the specimen tray on the left; the right column holds the token pile, the bug's live readout (cost, best, route, log), then the result. */
:root {
  --bg: #e9ecf2; --panel: #ffffff; --sunk: #f1f3f8; --ink: #171b2b; --muted: #5a6178; --line: #cfd4e2; --edge: #8a90a6;
  --accent: #3346c4; --accent-ink: #ffffff; --accent-soft: #e0e4fa;
  --bug: #c42f2a; --bug-soft: #fadedc; --tok: #c98a06; --tok-soft: #fbefcf; --tok-ink: #3a2a00;
  --ok: #1f7a43; --ok-soft: #dcf0e2;
  --f-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1220; --panel: #171b2c; --sunk: #1d2236; --ink: #e4e7f2; --muted: #9aa1b8; --line: #2c3350; --edge: #6d7491;
  --accent: #8f9cff; --accent-ink: #0d1030; --accent-soft: #22284d;
  --bug: #ff6f66; --bug-soft: #3d1b1b; --tok: #f0b93a; --tok-soft: #3a2e10; --tok-ink: #2a1e00;
  --ok: #6fca8e; --ok-soft: #15301f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2c; --sunk: #1d2236; --ink: #e4e7f2; --muted: #9aa1b8; --line: #2c3350; --edge: #6d7491;
  --accent: #8f9cff; --accent-ink: #0d1030; --accent-soft: #22284d;
  --bug: #ff6f66; --bug-soft: #3d1b1b; --tok: #f0b93a; --tok-soft: #3a2e10; --tok-ink: #2a1e00;
  --ok: #6fca8e; --ok-soft: #15301f; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.bar-in { max-width: 1200px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; font: 800 17px var(--f-display); }
.brand svg { width: 30px; height: 30px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 12px/1 var(--f-mono); padding: 7px 10px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); white-space: nowrap; }
.chip.you { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.chip.bugc { background: var(--bug); color: var(--panel); border-color: var(--bug); }

.wrap { max-width: 1200px; margin: 0 auto; padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 700 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.small { font-size: 14px; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 10px 16px; border-radius: var(--r); cursor: pointer; font-weight: 700; min-height: 44px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.red { background: var(--bug); color: var(--panel); border-color: var(--bug); }
.btn.red:hover { filter: brightness(1.08); background: var(--bug); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- start ---------- */
.start { display: grid; grid-template-columns: 1.25fr 1fr; gap: 32px; align-items: start; }
.start > * { min-width: 0; }
.start h1 { font-size: clamp(46px, 8vw, 96px); line-height: .92; letter-spacing: -.04em; }

.lede { font-size: 18px; max-width: 34em; margin: 16px 0 18px; }

.err { color: var(--bug); font-weight: 700; margin: 0; font-size: 14px; }

/* ---------- play ---------- */

.gmap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }

.fstrip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font: 500 12px/1.2 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 10px 16px; background: var(--sunk); border-bottom: 1px solid var(--line); color: var(--muted); }

.side { display: grid; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }

.pile { display: flex; align-items: center; gap: 14px; }
.pilebtn { width: 64px; height: 64px; border-radius: 50%; border: 0; padding: 0; cursor: grab; background: transparent; touch-action: none; flex: none; }
.pilebtn svg { width: 64px; height: 64px; display: block; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 0; min-width: 0; }
.stat span { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.lt { font: 700 10.5px var(--f-mono); text-align: center; border-radius: 4px; padding: 2px 0; }
.lt.move { background: var(--sunk); color: var(--ink); }
.lt.back { background: var(--sunk); color: var(--muted); }
.lt.cut { background: var(--bug-soft); color: var(--bug); }

.outcome { display: grid; gap: 8px; }

.verdict { display: flex; justify-content: space-between; align-items: baseline; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-family: var(--f-mono); }
.verdict b { font-size: 20px; }

/* svg graph */
.ed line { stroke: var(--edge); stroke-width: 3; stroke-linecap: round; }
.ed.walked line { stroke: var(--bug); stroke-opacity: .45; }
.ed.cut line { stroke: var(--bug); stroke-dasharray: 6 6; stroke-width: 4; stroke-opacity: 1; }
.ed.bestp line { stroke: var(--ok); stroke-width: 7; stroke-opacity: 1; }
.ed .wbg { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.ed .wt { font: 700 14px var(--f-mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ed.cut .wbg { stroke: var(--bug); fill: var(--bug-soft); }
.vx { cursor: pointer; outline: none; }
.vx .hit { fill: transparent; }
.vx .vc { fill: var(--sunk); stroke: var(--ink); stroke-width: 2.5; transition: fill .25s; }
.vx .vl { font: 700 17px var(--f-mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.vx.vis .vc { fill: var(--bug-soft); stroke: var(--bug); }
.vx.st .vc, .vx.fi .vc { stroke: var(--accent); stroke-width: 4; fill: var(--accent-soft); }
.vx.st, .vx.fi { cursor: default; }
.vx .tag { font: 700 10px var(--f-mono); fill: var(--accent); text-anchor: middle; letter-spacing: .08em; pointer-events: none; }
.vx:focus-visible .vc { stroke: var(--accent); stroke-width: 4; }
.vx.drop .vc { stroke: var(--tok); stroke-width: 5; }
.tokg { pointer-events: none; transition: transform .35s, opacity .35s; }
.tokg .t1 { fill: var(--tok); stroke: var(--tok-ink); stroke-width: 1.5; }
.tokg .t2 { fill: none; stroke: var(--tok-ink); stroke-width: 1.2; stroke-dasharray: 2 2; }
.tokg.gone { opacity: 0; transform: scale(.2); }
.badge rect { stroke-width: 1.5; }
.badge text { font: 700 10.5px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.badge.saved rect { fill: var(--ok-soft); stroke: var(--ok); } .badge.saved text { fill: var(--ok); }
.badge.eaten rect { fill: var(--bug-soft); stroke: var(--bug); } .badge.eaten text { fill: var(--bug); }
.badge.missed rect { fill: var(--sunk); stroke: var(--muted); } .badge.missed text { fill: var(--muted); }
.bugsp .bb { fill: var(--bug); stroke: var(--ink); stroke-width: 1.5; }
.bugsp .bh { fill: var(--ink); }
.bugsp .bl { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.bugsp .bs { fill: var(--ink); }
.bugsp .bd { stroke: var(--ink); stroke-width: 1.2; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); width: 44px; height: 44px; }

/* ---------- report ---------- */
.report { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; gap: 20px; }
.rep-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 16px; }

.rep-meta { margin: 6px 0 0; color: var(--muted); }
.rep-score { display: flex; gap: 18px; align-items: flex-end; }
.rs { display: grid; justify-items: center; }
.rs b { font: 800 72px/1 var(--f-display); }
.rs span { font: 700 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rs.you b { color: var(--ok); } .rs.bg b { color: var(--bug); }
.rep-verdict { font: 800 22px var(--f-display); }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.rep th { font: 700 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
.rep td { padding: 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
.rep .n { text-align: right; font-family: var(--f-mono); }
.rep tfoot td { border-bottom: 0; font-weight: 700; padding-top: 12px; }

/* ---------- cheat sheet ---------- */
html.locked, html.locked body { overflow: hidden; }
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 55%, transparent); display: flex; justify-content: center; align-items: stretch; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); width: 100%; max-width: 960px; border-radius: var(--r); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sheet-head { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: flex-end; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: clamp(22px, 4vw, 30px); }
.printnote { margin: 0; padding: 10px 20px; background: var(--tok-soft); font-size: 14px; border-bottom: 1px solid var(--line); }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; display: grid; gap: 4px; min-height: 0; flex: 1; }
.sheet-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.cs { padding-top: 16px; display: grid; gap: 10px; }
.cs + .cs { border-top: 1px solid var(--line); }
.cs h3 { font-size: 19px; color: var(--accent); }
.cs p { margin: 0; max-width: 62em; }
.cs ul, .cs ol { margin: 0; padding-left: 22px; display: grid; gap: 5px; max-width: 62em; }
.cs-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.cs-split > * { min-width: 0; }
.cs-split .gsvg { min-width: 0; }
.cst th { font: 700 11.5px var(--f-mono); color: var(--muted); text-align: left; padding: 5px 7px; border-bottom: 1px solid var(--line); }
.cst td { padding: 5px 7px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
.cst td.m { font-family: var(--f-mono); white-space: nowrap; }
.pseudo { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 500 13px/1.55 var(--f-mono); }

@media (max-width: 920px) {
  .start, .board, .cs-split { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}
@media (max-width: 520px) {
  .gmap { gap: 4px; } .gp { padding: 6px 4px; text-align: center; }
  .report { padding: 16px; } .rep .opt { display: none; } .rep th, .rep td { padding: 7px 4px; }
  .rs b { font-size: 56px; }
  .sheet-head, .printnote, .sheet-body, .sheet-foot { padding-left: 14px; padding-right: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {

  body::before { display: none; }

  html.locked, html.locked body { overflow: visible; }
  .overlay { position: static; background: none; padding: 0; display: block; }
  .sheet { border: 0; max-width: none; overflow: visible; display: block; background: #fff; }
  .sheet-body { overflow: visible; padding: 0; display: block; }
  .cs { break-inside: avoid; }
}

<script>
(function () {
  'use strict';
  const STANDALONE = true; // true in the downloadable copy, where printing works
  const GRAPHS = 10;
  // Each graph is bigger and denser than the one before: n vertices on a c x r grid, d = chance of a diagonal edge in each grid square.
  const SIZES = [
    { n: 6, c: 4, r: 2, d: .30 }, { n: 7, c: 4, r: 2, d: .35 }, { n: 8, c: 4, r: 2, d: .40 }, { n: 9, c: 4, r: 3, d: .40 }, { n: 10, c: 4, r: 3, d: .45 },
    { n: 11, c: 5, r: 3, d: .45 }, { n: 12, c: 5, r: 3, d: .50 }, { n: 13, c: 6, r: 3, d: .50 }, { n: 14, c: 5, r: 4, d: .55 }, { n: 16, c: 6, r: 4, d: .55 }];
  const HEIGHT = { 2: 360, 3: 440, 4: 540 };
  const VW = 720, VH = 440;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const app = document.getElementById('app');
  let S, runId = 0;

  const fresh = () => ({ screen: 'start', name: '', nameErr: false, graphs: [], cur: 0, guide: false, speed: 1, finished: null });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ===== the bug: depth-first branch and bound =====
  // Neighbors are tried cheapest edge first (ties alphabetical). A vertex already on the current route is never re-entered.
  // An edge is abandoned when (cost so far + edge weight) >= the best complete route found so far.
  function solve(g) {
    const ev = []; let best = Infinity, bestPath = null;
    const visited = new Set([g.start]), on = new Set([g.start]), path = [g.start];
    const dfs = (v, cost) => {
      if (v === g.finish) {
        best = cost; bestPath = path.slice();
        ev.push({ t: 'best', v, cost, path: path.slice() });
        return;
      }
      for (const [u, w] of g.adj[v]) {
        if (on.has(u)) continue;
        if (cost + w >= best) { ev.push({ t: 'cut', from: v, to: u, w, cost, best }); continue; }
        ev.push({ t: 'move', from: v, to: u, w, cost: cost + w, best });
        visited.add(u); on.add(u); path.push(u);
        dfs(u, cost + w);
        path.pop(); on.delete(u);
        ev.push({ t: 'back', from: u, to: v, cost, best });
      }
    };
    dfs(g.start, 0);
    ev.push({ t: 'done', best });
    return { ev, best, bestPath, visited: [...visited] };
  }
  function buildAdj(g) {
    g.adj = g.V.map(() => []);
    g.E.forEach(e => { g.adj[e.a].push([e.b, e.w]); g.adj[e.b].push([e.a, e.w]); });
    g.adj.forEach(list => list.sort((p, q) => p[1] - q[1] || g.V[p[0]].label.localeCompare(g.V[q[0]].label)));
  }

  // ===== graph generation =====
  function genGraph(cfg, round, relax) {
    for (let tries = 0; tries < 600; tries++) {
      const cells = [];
      for (let c = 0; c < cfg.c; c++) for (let r = 0; r < cfg.r; r++) cells.push({ c, r });
      const sr = rint(0, cfg.r - 1), fr = rint(0, cfg.r - 1);
      const sCell = cells.find(x => x.c === 0 && x.r === sr);
      const fCell = cells.find(x => x.c === cfg.c - 1 && x.r === fr);
      let pool = shuffle(cells.filter(x => x !== sCell && x !== fCell));
      const keep = new Set([sCell, fCell, ...pool.slice(0, cfg.n - 2)]);
      const kept = cells.filter(x => keep.has(x));
      const xs = c => 70 + c * ((VW - 140) / (cfg.c - 1));
      const ys = r => cfg.r === 2 ? [100, 260][r] : 70 + r * ((HEIGHT[cfg.r] - 140) / (cfg.r - 1));
      const pts = kept.map(x => ({ c: x.c, r: x.r, x: xs(x.c) + (x === sCell || x === fCell ? 0 : rint(-24, 24)), y: ys(x.r) + rint(-22, 22) }));
      // labels left to right, top to bottom
      const order = pts.map((p, i) => i).sort((a, b) => pts[a].x - pts[b].x || pts[a].y - pts[b].y);
      const V = order.map((i, k) => ({ id: k, label: String.fromCharCode(65 + k), x: pts[i].x, y: pts[i].y, c: pts[i].c, r: pts[i].r }));
      const at = (c, r) => V.find(v => v.c === c && v.r === r);
      const E = []; const has = new Set();
      const add = (a, b) => { const k = Math.min(a, b) + '-' + Math.max(a, b); if (a === b || has.has(k)) return; has.add(k); E.push({ a, b, w: rint(1, 9) }); };
      for (const v of V) {
        const rt = at(v.c + 1, v.r), dn = at(v.c, v.r + 1);
        if (rt && Math.random() < .7 + cfg.d * .4) add(v.id, rt.id);
        if (dn && Math.random() < .6 + cfg.d * .5) add(v.id, dn.id);
      }
      for (let c = 0; c < cfg.c - 1; c++) for (let r = 0; r < cfg.r - 1; r++) {
        if (Math.random() > cfg.d) continue;
        if (Math.random() < .5) { const a = at(c, r), b = at(c + 1, r + 1); if (a && b) add(a.id, b.id); }
        else { const a = at(c + 1, r), b = at(c, r + 1); if (a && b) add(a.id, b.id); }
      }
      // connect components (nearest pair)
      const par = V.map((_, i) => i);
      const find = i => par[i] === i ? i : (par[i] = find(par[i]));
      E.forEach(e => { par[find(e.a)] = find(e.b); });

      while (new Set(V.map(v => find(v.id))).size > 1 && guard++ < 20) {

          const d = Math.hypot(a.x - b.x, a.y - b.y); if (d < bestD) { bestD = d; pair = [a.id, b.id]; }
        }
        add(pair[0], pair[1]); par[find(pair[0])] = find(pair[1]);
      }
      const g = { h: HEIGHT[cfg.r], V, E, start: V.find(v => v.c === sCell.c && v.r === sCell.r).id, finish: V.find(v => v.c === fCell.c && v.r === fCell.r).id };

      const sol = solve(g);
      const unvisited = V.length - sol.visited.length;
      const moves = sol.ev.filter(e => e.t === 'move').length;
      const bests = sol.ev.filter(e => e.t === 'best').length;
      const cuts = sol.ev.filter(e => e.t === 'cut').length;

      if (!relax && E.length < V.length + Math.floor(round / 2)) continue; // later graphs need more loops
      const small = V.length <= 7;
      if (unvisited < (small ? 1 : 2 + lvl) || unvisited > V.length - 3) continue;
      if (moves < Math.min(6, V.length - 1) || moves > 14 + 4 * round || cuts < (small ? 1 : 2 + lvl)) continue;
      if (sol.bestPath.length < 4) continue;
      if (round >= 1 && bests < 2) continue;
      if (!relax && round >= 6 && bests < 3) continue;

      <div class="sheet-body">
        <div class="cs"><h3>Graph vocabulary</h3>
          <ul><li>A <b>graph</b> is a set of <b>vertices</b> (A, B, C…) joined by <b>edges</b>. These graphs are <b>undirected</b>: an edge can be walked either way.</li>

      if cost + w >= best: abandon   # the bound: cannot beat best

        <div class="cs"><h3>Branch and bound</h3>
          <p>Every edge weight is positive, so a route only gets more expensive as it grows. Once the bug knows a complete route of cost <i>best</i>, any partial route whose cost reaches <i>best</i> can never win, so the whole branch beyond it is skipped. That is why some vertices are never visited. Before the first route is found, best is ∞ and nothing is abandoned, so the first greedy dive visits the most.</p></div>
        <div class="cs"><h3>Worked example</h3>
          <div class="cs-split"><div class="specimen">${graphSVG(h, { visited: h.sol.visited, bestPath: h.sol.bestPath, aria: 'Worked example graph' })}</div>
          <div class="tscroll"><table class="cst"><thead><tr><th>#</th><th>Step</th><th>What the bug does</th></tr></thead><tbody>${rows}</tbody></table></div></div>
          <p>Cheapest route: ${h.sol.bestPath.map(id => h.V[id].label).join(' → ')} (cost ${h.sol.best}). Never visited: ${unv.length ? unv.join(', ') : 'none'}.</p></div>
        <div class="cs"><h3>Strategy</h3>
          <ul><li>Trace the first dive yourself: from Start, keep taking the cheapest edge to a vertex not on your route. Every vertex on that dive is eaten.</li>
            <li>Note the cost when the bug first reaches Finish. That number is the bound.</li>
            <li>A vertex is safe only if every route to it from Start costs at least the best route's cost by the time the bug would take its last edge.</li>
            <li>Better routes found later make the bound tighter, so they never make the bug visit more.</li></ul></div>
        <div class="cs"><h3>Scoring</h3>
          <ul><li>Token on a vertex the bug never visits: +1 you.</li><li>Token eaten: +1 bug.</li><li>Unvisited vertex with no token: +1 bug.</li><li>A visited vertex without a token scores nothing.</li><li>Ten graphs, growing from 6 to 16 vertices; your name and both totals appear on the report you screenshot and submit.</li></ul></div>
      </div>
      <div class="sheet-foot">${STANDALONE ? '<button class="btn" data-act="print">Print</button>' : ''}<button class="btn primary" data-act="guideClose">Back to the game</button></div>
    </div></div>`;
  }

  function render() {
    const y = window.scrollY;
    const main = S.screen === 'start' ? startScreen() : S.screen === 'play' ? playScreen() : reportScreen();
    app.innerHTML = bar() + `<main class="wrap">${main}</main>` + (S.guide ? guideSheet() : '');
    document.documentElement.classList.toggle('locked', !!S.guide);
    window.scrollTo(0, y);
    const lg = document.getElementById('log'); if (lg) lg.scrollTop = lg.scrollHeight;
  }

  // ===== tokens =====
  function setToken(id, on) {
    const g = G(); if (g.phase !== 'place') return;
    id = Number(id);
    if (id === g.start || id === g.finish) return;
    const has = g.tokens.includes(id);
    if (on && !has) g.tokens.push(id);
    if (!on && has) g.tokens = g.tokens.filter(x => x !== id);
    render();
  }

  // ===== the run =====
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function tween(el, from, to, ms, my) {
    return new Promise(res => {
      const ang = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI + 90;
      if (reduce || ms < 30) { el.setAttribute('transform', `translate(${to.x},${to.y - 4}) rotate(${ang})`); return res(); }
      const t0 = performance.now();
      const f = now => {
        if (my !== runId) return res();
        const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        el.setAttribute('transform', `translate(${from.x + (to.x - from.x) * e},${from.y + (to.y - from.y) * e - 4}) rotate(${ang})`);
        k < 1 ? requestAnimationFrame(f) : res();
      };
      requestAnimationFrame(f);
    });
  }
  async function run() {
    const g = G(); if (g.phase !== 'place') return;
    g.phase = 'run'; render();
    const my = ++runId;
    const bug = document.getElementById('bug'); bug.style.display = '';
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    const log = document.getElementById('log');
    const tok = new Set(g.tokens);
    const route = [g.start]; let eaten = 0;
    const dur = base => reduce ? 30 : base / S.speed;
    for (const e of g.sol.ev) {
      if (my !== runId) return;
      const l = logLine(g, e);
      if (l) { const li = document.createElement('li'); li.innerHTML = `<span class="lt ${l[0]}">${l[1]}</span><span>${l[2]}</span>`; log.appendChild(li); log.scrollTop = log.scrollHeight; }
      if (e.t === 'move' || e.t === 'back') {
        const edge = document.querySelector(`[data-e="${edgeKey(e.from, e.to)}"]`);
        if (e.t === 'move' && edge) edge.classList.add('walked');
        await tween(bug, g.V[e.from], g.V[e.to], dur(e.t === 'move' ? 620 : 380), my);
        if (my !== runId) return;
        if (e.t === 'move') {
          route.push(e.to);
          const vx = document.getElementById('v' + e.to); if (vx && e.to !== g.finish) vx.classList.add('vis');
          if (tok.has(e.to)) { tok.delete(e.to); eaten++; const t = vx && vx.querySelector('.tokg'); if (t) t.classList.add('gone'); set('stEaten', eaten); }
        } else route.pop();
        set('stCost', e.cost);
        set('stRoute', route.map(id => L(g, id)).join(' → '));
        await wait(dur(e.t === 'move' ? 160 : 60));
      } else if (e.t === 'cut') {
        const edge = document.querySelector(`[data-e="${edgeKey(e.from, e.to)}"]`);
        if (edge) edge.classList.add('cut');
        await wait(dur(700));
      } else if (e.t === 'best') {
        set('stBest', e.cost);
        await wait(dur(900));
      }
    }
    if (my !== runId) return;
    endRun();
  }
  function endRun() {
    runId++;
    const g = G(); if (g.phase === 'done') return;
    g.phase = 'done'; g.result = score(g);
    render();
  }
  function next() {
    S.cur++;
    if (S.cur >= GRAPHS) { S.cur = GRAPHS - 1; S.screen = 'report'; S.finished = new Date().toISOString(); }
    render(); window.scrollTo(0, 0);
  }

  // ===== input =====
  let suppressClick = false;
  app.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    const sp = e.target.closest('[data-speed]');
    if (sp) { S.speed = Number(sp.dataset.speed); document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', Number(b.dataset.speed) === S.speed)); return; }
    const a = e.target.closest('[data-act]');
    if (a) {
      const act = a.dataset.act;
      if (act === 'guideBg') { if (e.target === a) { S.guide = false; render(); } return; }
      if (act === 'guide') { S.guide = true; render(); return; }
      if (act === 'guideClose') { S.guide = false; render(); return; }
      if (act === 'print') { try { window.print(); } catch (_) {} return; }
      if (act === 'run') return run();
      if (act === 'skipRun') return endRun();
      if (act === 'clearTok') { G().tokens = []; render(); return; }
      if (act === 'next') return next();
      if (act === 'again') { const name = S.name, speed = S.speed; S = fresh(); S.name = name; S.speed = speed; render(); window.scrollTo(0, 0); return; }
      return;
    }
    const v = e.target.closest('[data-v]');
    if (v) { const g = G(); const id = Number(v.dataset.v); setToken(id, !g.tokens.includes(id)); }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    const v = (document.getElementById('nameIn').value || '').trim();
    if (!v) { S.name = ''; S.nameErr = true; render(); document.getElementById('nameIn').focus(); return; }
    newGame(v); render(); window.scrollTo(0, 0);
  });
  app.addEventListener('input', e => { if (e.target.id === 'nameIn') S.name = e.target.value; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.guide) { S.guide = false; render(); return; }
    const v = e.target.closest && e.target.closest('[data-v]');
    if (v && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const g = G(); const id = Number(v.dataset.v); setToken(id, !g.tokens.includes(id)); const el = document.getElementById('v' + id); if (el) el.focus(); }
  });

  // drag tokens from the pile, or off / between vertices
  let drag = null;
  app.addEventListener('pointerdown', e => {
    if (S.screen !== 'play' || G().phase !== 'place') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const pile = e.target.closest('#pile');
    const v = e.target.closest('[data-v]');
    if (pile) { drag = { from: null, x0: e.clientX, y0: e.clientY, pid: e.pointerId, moved: false }; e.preventDefault(); }
    else if (v && G().tokens.includes(Number(v.dataset.v))) drag = { from: Number(v.dataset.v), x0: e.clientX, y0: e.clientY, pid: e.pointerId, moved: false };
  });
  const vAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-v]'); };
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
      drag.moved = true;
      const gh = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      gh.setAttribute('viewBox', '-16 -16 32 32'); gh.setAttribute('class', 'ghost');
      gh.innerHTML = `<g class="tokg" transform="scale(1.3)">${TOKEN}</g>`;
      document.body.appendChild(gh); drag.ghost = gh;
      if (drag.from != null) { const t = document.querySelector(`#v${drag.from} .tokg`); if (t) t.style.opacity = '.3'; }
    }
    e.preventDefault();
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    const h = vAt(e.clientX, e.clientY);
    if (h !== drag.hot) { if (drag.hot) drag.hot.classList.remove('drop'); drag.hot = h; if (h) h.classList.add('drop'); }
  }, { passive: false });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (!d.moved) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    if (d.ghost) d.ghost.remove();
    if (d.hot) d.hot.classList.remove('drop');
    const g = G();
    const h = cancel ? null : vAt(e.clientX, e.clientY);
    const to = h ? Number(h.dataset.v) : null;
    if (d.from != null) g.tokens = g.tokens.filter(x => x !== d.from);
    if (to != null && !g.tokens.includes(to)) g.tokens.push(to);
    if (cancel && d.from != null) g.tokens.push(d.from);
    render();
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  // ===== boot =====
  function start(data) {
    S = data && data.S ? data.S : fresh();
    if (S.screen === 'play' && S.graphs[S.cur] && S.graphs[S.cur].phase === 'run') { S.graphs[S.cur].phase = 'done'; S.graphs[S.cur].result = score(S.graphs[S.cur]); }
    render();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (_) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
