<style>

<script>
(function () {
  'use strict';
  const STANDALONE = false; // set true in the downloadable copy, where printing works
  const OPS = ['+', '-', '*', '/'];
  const PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const M = {
    pre:  { name: 'Preorder',  notation: 'Prefix',  order: 'Node → Left → Right', code: 'NLR' },
    in:   { name: 'Inorder',   notation: 'Infix',   order: 'Left → Node → Right', code: 'LNR' },
    post: { name: 'Postorder', notation: 'Postfix', order: 'Left → Right → Node', code: 'LRN' },

  const ROUNDS = 10, PENALTY = 3, HINT_COST = 1;
  const NODEW = 66, SLOTW = 50, ROOTW = 110, LEVEL = 84, TOP = 40;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const app = document.getElementById('app');
  let S;

  const fresh = () => ({ screen: 'start', name: '', nameErr: false, rounds: [], cur: 0, sel: null, busy: false, fb: null, out: null, guide: false, confirmSkip: false, finished: null });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ===== expression trees =====
  const TA = { tok: h => h.t, l: h => h.l || null, r: h => h.r || null };
  // Walk a tree with any accessor. Inorder adds the minimum parentheses needed (left-associative), which makes infix output unique per tree.
  function walk(method, root, A) {
    const ev = [];
    const pre = h => { if (h == null) return; ev.push({ h, tok: A.tok(h) }); pre(A.l(h)); pre(A.r(h)); };
    const post = h => { if (h == null) return; post(A.l(h)); post(A.r(h)); ev.push({ h, tok: A.tok(h) }); };
    const inn = (h, pp, right) => {
      if (h == null) return;

  }
  function reportScreen() {
    const d = new Date(S.finished || Date.now());
    const rows = S.rounds.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${M[r.method].name}</td><td class="eqc">${esc(fmt(r.infix, 'in'))}</td><td class="n opt">${r.wrong}</td><td class="opt">${r.hint ? 'Yes' : ''}</td><td>${r.status === 'done' ? 'Solved' : 'Answer shown'}</td><td class="n"><b>${r.points}</b></td></tr>`).join('');
    const solved = S.rounds.filter(r => r.status === 'done').length;
    const clean = S.rounds.filter(r => r.status === 'done' && r.wrong === 0).length;
    return `<section class="report">
      <div class="rep-head">
        <div><p class="eyebrow">Expression Arbor · Score report</p><h2 class="rep-name">${esc(S.name)}</h2>
        <p class="rep-meta">${d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}, ${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })} · ${solved} of ${ROUNDS} trees solved · ${clean} on the first try</p></div>
        <div class="rep-score"><b>${total()}</b><span>/ 100</span></div>
      </div>
      <div class="tscroll"><table class="rep"><thead><tr><th class="n">#</th><th>Traversal</th><th>Equation</th><th class="n opt">Wrong walks</th><th class="opt">Hint</th><th>Result</th><th class="n">Points</th></tr></thead>
        <tbody>${rows}</tbody><tfoot><tr><td></td><td colspan="2">Total</td><td class="opt"></td><td class="opt"></td><td></td><td class="n">${total()}</td></tr></tfoot></table></div>
      <p class="small">Take a screenshot of this report (with your name and score showing) and upload it to submit.</p>
      <div class="actions"><button class="btn" data-act="again">Play a new set of 10</button></div>
    </section>`;
  }
  function guideSheet() {
    const ex = { t: '*', l: { t: '+', l: { t: '3' }, r: { t: '4' } }, r: { t: '2' } };
    return `<div class="overlay" data-act="guideBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
      <div class="sheet-head"><div><p class="eyebrow">Expression Arbor</p><h2 id="gTitle">Traversal cheat sheet</h2></div>
        <div class="actions">${STANDALONE ? '<button class="btn" data-act="print">Print</button>' : ''}<button class="btn" data-act="guideClose">Close</button></div></div>
      ${STANDALONE ? '' : '<p class="printnote">To print this sheet, open the downloadable copy of the game and use its Print button (or Ctrl+P / Cmd+P).</p>'}
      <div class="sheet-body">
        <div class="cs"><h3>What an expression tree stores</h3>
          <div class="cs-split"><div class="canvas">${treeHTML(viewTarget(ex))}</div>
          <ul><li><b>Operators</b> (+ − * /) are internal nodes with exactly two children: the left operand and the right operand.</li>
            <li><b>Numbers</b> (operands) are always leaves.</li>
            <li><b>No parentheses.</b> Grouping is shown by depth: an operation lower in the tree happens first. The tree above is (3 + 4) * 2.</li>
            <li>Evaluating the tree is a postorder walk: evaluate both children, then apply the operator.</li></ul></div></div>
        <div class="cs"><h3>The three traversals</h3>
          <div class="tscroll"><table class="cst"><thead><tr><th>Traversal</th><th>Visit order</th><th>Produces</th><th>Example tree gives</th></tr></thead><tbody>
            <tr><td><b>Preorder</b></td><td>Node, Left, Right (NLR)</td><td>Prefix (Polish) notation</td><td><code>${fmt(toks('pre', ex), 'pre')}</code></td></tr>
            <tr><td><b>Inorder</b></td><td>Left, Node, Right (LNR)</td><td>Infix notation (add parentheses where needed)</td><td><code>${fmt(toks('in', ex), 'in')}</code></td></tr>
            <tr><td><b>Postorder</b></td><td>Left, Right, Node (LRN)</td><td>Postfix (reverse Polish) notation</td><td><code>${fmt(toks('post', ex), 'post')}</code></td></tr>
          </tbody></table></div>
          <pre class="pseudo">preorder(n):  if n: visit(n); preorder(n.left); preorder(n.right)
inorder(n):   if n: inorder(n.left); visit(n); inorder(n.right)
postorder(n): if n: postorder(n.left); postorder(n.right); visit(n)</pre></div>
        <div class="cs"><h3>Finding the root</h3>
          <ul><li><b>Prefix:</b> the first token is the root. Everything after it splits into the left subtree's tokens, then the right subtree's.</li>
            <li><b>Postfix:</b> the last token is the root. Read right to left: the right subtree comes just before the root.</li>
            <li><b>Infix:</b> the root is the operator applied last: the lowest-precedence operator that is outside all parentheses. If several tie, take the rightmost (left-to-right evaluation). Split the expression there into left and right halves and repeat.</li>
            <li>Precedence: * and / bind tighter than + and −.</li></ul></div>
        <div class="cs"><h3>Inorder and parentheses</h3>
          <p>A plain inorder walk loses grouping: both (3 + 4) * 2 and 3 + 4 * 2 would print as 3 + 4 * 2. In this game the inorder walk adds a pair of parentheses around a subtree only when it is needed: when the child operator has lower precedence than its parent, or equal precedence on the right side (8 − (3 − 1) keeps its parentheses).</p></div>
        <div class="cs"><h3>Scoring</h3>
          <ul><li>10 rounds, 10 points each, 100 total.</li><li>Each wrong traversal costs ${PENALTY} points. The hint (the expected prefix, infix or postfix output) costs ${HINT_COST}. A solved round always earns at least 1.</li><li>Traverse is blocked, with no penalty, while an operator still has an empty slot.</li><li>Show answer ends the round with 0 points.</li><li>Your name and final score appear on the report you screenshot and submit.</li></ul></div>
      </div>
      <div class="sheet-foot">${STANDALONE ? '<button class="btn" data-act="print">Print</button>' : ''}<button class="btn primary" data-act="guideClose">Back to the game</button></div>
    </div></div>`;
  }

  function render() {
    const y = window.scrollY;
    let main = S.screen === 'start' ? startScreen() : S.screen === 'play' ? playScreen() : reportScreen();
    app.innerHTML = bar() + `<main class="wrap">${main}</main>` + (S.guide ? guideSheet() : '');
    document.documentElement.classList.toggle('locked', !!S.guide);
    window.scrollTo(0, y);
  }

  // ===== input: clicks =====
  let suppressClick = false;
  function handleSelect(id) {
    if (locked()) return;
    S.sel = S.sel === id ? null : id;
    if (S.fb && S.fb.kind === 'info') S.fb = null;
    render();
  }
  app.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
    const a = e.target.closest('[data-act]');
    if (a) {
      const act = a.dataset.act;
      if (act === 'guideBg') { if (e.target === a) { S.guide = false; render(); } return; }
      if (act === 'guide') { S.guide = true; render(); return; }
      if (act === 'guideClose') { S.guide = false; render(); return; }
      if (act === 'print') { try { window.print(); } catch (_) {} return; }
      if (act === 'traverse') return traverse();
      if (act === 'clear') { const r = R(); if (locked()) return; r.nodes = {}; r.root = null; edited(); return; }
      if (act === 'skip') return skip();
      if (act === 'hint') { const r = R(); if (locked() || r.hint) return; r.hint = true; render(); return; }
      if (act === 'next') return next();
      if (act === 'again') { const name = S.name; S = fresh(); S.name = name; render(); return; }
      return;
    }
    const rm = e.target.closest('[data-remove]');
    if (rm) return toTray(rm.dataset.remove);
    const tile = e.target.closest('[data-tile]');
    if (tile) return handleSelect(tile.dataset.tile);
    const node = e.target.closest('[data-node]');
    if (node) return handleSelect(node.dataset.node);
    const slot = e.target.closest('[data-slot]');
    if (slot) {
      if (S.sel) place(S.sel, slot.dataset.slot);
      else { S.fb = { kind: 'info', msg: 'Pick a tile first (tap it, or drag it onto this slot).' }; render(); }
      return;
    }
    if (e.target.closest('[data-tray]') && S.sel) {
      const r = R(); if (r.nodes[S.sel]) toTray(S.sel); else { S.sel = null; render(); }
    }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    const v = (document.getElementById('nameIn').value || '').trim();
    if (!v) { S.name = ''; S.nameErr = true; render(); document.getElementById('nameIn').focus(); return; }
    newGame(v); render(); window.scrollTo(0, 0);
  });
  app.addEventListener('input', e => { if (e.target.id === 'nameIn') S.name = e.target.value; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (S.guide) { S.guide = false; render(); } else if (S.sel) { S.sel = null; render(); } return; }
    const n = e.target.closest && e.target.closest('[data-node]');
    if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); handleSelect(n.dataset.node); }
  });

  // ===== input: drag (pointer events work for mouse, pen and touch) =====
  let drag = null;
  app.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('[data-remove]')) return;
    const el = e.target.closest('[data-tile],[data-node]');
    if (!el || locked()) return;
    drag = { id: el.dataset.tile || el.dataset.node, el, x0: e.clientX, y0: e.clientY, pid: e.pointerId, moved: false, ghost: null, hot: null };
  });
  function hotAt(x, y) {
    const under = document.elementFromPoint(x, y);
    if (!under) return null;
    return under.closest('[data-slot]') || under.closest('[data-tray]');
  }
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
      drag.moved = true;
      const g = drag.el.cloneNode(true);
      g.querySelectorAll('.vo').forEach(x => x.remove());
      g.classList.remove('sel', 'cur'); g.classList.add('ghost'); g.removeAttribute('data-node'); g.removeAttribute('data-tile');
      g.style.left = '0px'; g.style.top = '0px';
      document.body.appendChild(g); drag.ghost = g;
      drag.el.classList.add('lifted');
      document.body.classList.add('is-dragging');
      document.querySelectorAll('.canvas').forEach(c => c.classList.add('has-sel'));
    }
    e.preventDefault();
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    const h = hotAt(e.clientX, e.clientY);
    if (h !== drag.hot) {
      if (drag.hot) drag.hot.classList.remove('hot', 'drop-hot');
      drag.hot = h;
      if (h) h.classList.add(h.dataset.slot !== undefined ? 'hot' : 'drop-hot');
    }
  }, { passive: false });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (!d.moved) return; // a plain click; the click handler selects
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    if (d.ghost) d.ghost.remove();
    document.body.classList.remove('is-dragging');
    if (d.hot) d.hot.classList.remove('hot', 'drop-hot');
    const h = cancel ? null : hotAt(e.clientX, e.clientY);
    if (h && h.dataset.slot !== undefined) { S.sel = null; place(d.id, h.dataset.slot); return; }
    if (h && R().nodes[d.id]) { toTray(d.id); return; }
    render();
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  // ===== boot (keeps an in-progress game across live updates of the page) =====
  function start(data) {
    S = data && data.S ? data.S : fresh();
    if (S.busy) { S.busy = false; S.out = null; }
    render();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (_) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
